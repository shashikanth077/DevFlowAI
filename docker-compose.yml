# DevFlow AI - full local stack (LLMs: Anthropic Claude or OpenAI, set in .env)
#   docker compose up -d --build
#   dashboard: http://localhost:3000   API docs: http://localhost:8000/docs
name: devflow-ai

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devflow}
      POSTGRES_DB: ${POSTGRES_DB:-devflow}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-devflow}:${POSTGRES_PASSWORD:-devflow}@postgres:5432/${POSTGRES_DB:-devflow}
      WORKSPACE_ROOT: /var/lib/devflow/workspaces
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - workspaces:/var/lib/devflow/workspaces
      # The backend (not generated code) needs the Docker API to start sandbox
      # containers. Sandboxes never receive this socket or any host mount.
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-999}"

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports:
      - "3000:80"

volumes:
  postgres-data:
  workspaces:
